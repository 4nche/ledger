services:
  postgres:
    image: postgres:17-alpine
    container_name: trading-journal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-journal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-journal}
      POSTGRES_DB: ${POSTGRES_DB:-trading_journal}
      # Deterministic reporting depends on the server never guessing a timezone.
      # Everything is stored UTC; reporting timezone is always passed explicitly.
      TZ: UTC
      PGTZ: UTC
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-journal} -d ${POSTGRES_DB:-trading_journal}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
